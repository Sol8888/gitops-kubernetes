apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sol8888/gitops-kubernetes.git
    targetRevision: main
    path: manifiestos
  destination:
    server: https://kubernetes.default.svc
    namespace: practica-gitops
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: web-gitops
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true